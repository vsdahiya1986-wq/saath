# The five gates (07_TRANSLATION_AND_REMAINING.md). The translation gate is
# offline: it checks the committed Assamese against docs/i18n-review.json and
# needs no Bhashini key — translating is a local, keyed step (`npm run translate`).
name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # next-env.d.ts references .next/types/*, emitted only by a build,
      # so the typecheck has to run after it.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run verify-translations
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      # This runner is the only place several of these bugs are visible, so a
      # failure here has to leave something behind to look at. Both paths: the
      # html report, and test-results/, which holds the trace zips, screenshots
      # and video the report links to.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
